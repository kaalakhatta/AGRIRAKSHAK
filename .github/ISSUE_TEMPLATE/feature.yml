name: Feature
description: Propose a scoped product or engineering task
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What should a farmer, student, or team member be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List observable checks that prove the task is complete.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Add designs, sources, metrics, or related issues.
