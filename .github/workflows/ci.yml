name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  ml-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q ml/src ml/tests
      - name: Run dependency-free ML unit tests
        run: PYTHONPATH=ml/src python -m unittest discover -s ml/tests -v
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Lint API
        run: python -m ruff check services/api/src services/api/tests
      - name: Test API
        run: python -m pytest services/api/tests
