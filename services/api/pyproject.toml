[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrirakshak-api"
version = "0.1.0"
description = "Hosted ONNX inference API for AgriRakshak"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "onnxruntime>=1.22,<2",
  "Pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

